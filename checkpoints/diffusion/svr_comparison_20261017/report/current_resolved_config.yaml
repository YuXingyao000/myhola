trainer:
  devices: 8
  accelerator: gpu
  precision: bf16-mixed
  num_workers: 4
  num_threads: 4
  prefetch_factor: 4
  persistent_workers: true
  ddp_find_unused_parameters: false
  ddp_gradient_as_bucket_view: true
  batch_size: 64
  learning_rate: 0.0001
  max_epochs: 1000000
  max_steps: 10000000
  max_time: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  vae_validation_inference: false
  diffusion_validation_inference: false
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  sync_train_step_loss: false
  seed: 42
  deterministic: false
  cudnn_benchmark: true
  checkpoint_enable_version_counter: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  wandb:
    enabled: true
    project: hola-brep
    name: null
    offline: false
  resume_from_checkpoint: /mnt/d/python/checkpoints/diffusion_layerwise_svr/20261016T143450.891057Z/weights/last.ckpt
  init_from_checkpoint: null
  evaluate: false
  test_output_dir: null
  output_dir: ./checkpoints
  run_dir: /mnt/d/python/checkpoints/diffusion_layerwise_svr/20261016T143450.891057Z
  exp_name: diffusion_layerwise_svr
dataset:
  name: Diffusion_dataset
  raw_data_root: /mnt/d/data/deepcad_v7
  train_dataset: /dev/shm/hola-svr-20261016/splits/train.txt
  val_dataset: /dev/shm/hola-svr-20261016/splits/validation.txt
  test_dataset: src/brepnet/data/list/deduplicated_deepcad_testing_7_30.txt
  cached_latent_root: /dev/shm/hola-svr-20261016/latents
  condition_data_root: /dev/shm/hola-svr-20261016/conditions
  condition_name: single_img
  cached_condition: false
  is_aug: false
  is_overfit: false
  load_topology: false
  visibility_root: null
  topology_visibility_weighted: false
  max_faces: 30
  padding: random
  num_points: 10000
  epoch_scale_factor: 200
  real_photo_ratio: 0.0
  validation_real_photo_ratio: 0.0
  read_single_image_view: true
  return_original_images: false
  augmentation:
    enabled: true
    random_rotate: true
    random_scale: true
    scale_range:
    - 0.9
    - 1.1
model:
  name: Diffusion
  stage: diffusion
  loss: l2
  latent:
    dim: 32
    use_cached_latents: true
    use_mean: true
  padding:
    type: random
    max_faces: 30
    valid_loss_weight: 0.01
  noise:
    prediction_type: epsilon
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    beta_end: 0.02
    variance_type: fixed_small
    num_train_timesteps: 1000
  denoiser:
    conditioning: layerwise_cross_attention
    hidden_dim: 768
    num_layers: 24
    nhead_divisor: 64
    feedforward_dim: 2048
    dropout: 0.1
  topology_bias:
    enabled: false
    source: gt_adjacency
    target: self_attention
    mode: soft_bias
    timestep_weight: linear_high_noise
    parameterization: additive
    scale: 2.0
    max_multiplier: 2.0
    predictor:
      checkpoint: null
      max_faces: 30
      hidden_dim: 512
      face_dim: 128
      dino_model: facebook/dinov2-large
      freeze: true
      edge_threshold: 0.5
  autoencoder:
    name: AutoEncoder_light
    stage: vae
    mode: frozen_inference
    checkpoint: /mnt/d/data/ae_checkpoints/1119_deepcad_aug1_11k.ckpt
    in_channels: 6
    latent_channels: 8
    hidden_channels: 768
    norm: layer
    gaussian_weights: 1.0e-06
    sigmoid: false
    num_gat_layers: 5
    bottleneck_dim: 768
    num_encoder_layers: 8
    num_decoder_layers: 8
    nhead: 16
    with_intersection: true
    intersection_dim: 512
    intersection_layers: 8
    intersection_noise_std: 0.0
    trainable_scope: all
    trainable_module_prefixes:
    - inter
    - classifier
    loss: l1
condition:
  type: single_img
  condition_name: single_img
  cached_features: false
  output_dim: 1024
  image:
    backbone: dinov2
    depth_anything_v2_ckpt: null
    augment_probability: 0.0
  point_cloud:
    encoder: pointnet
    augment_probability: 0.0
eval:
  enabled: false
  output_dir: null
  num_samples: 100
  post_process: true
