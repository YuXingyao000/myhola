[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hola-brep"
version = "0.2.0"
description = "HoLa-BRep: Holistic Latent B-Rep Generation"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "torch>=2.4",
    "pytorch-lightning>=2.2",
    "hydra-core==1.3.2",
    "omegaconf>=2.3",
    "diffusers>=0.27",
    "transformers>=4.36",
    "einops>=0.7",
    "torch-scatter",
    "torch-sparse",
    "trimesh",
    "open3d>=0.18",
    "sentence-transformers>=2.2",
    "wandb",
    "tensorboard",
    "scipy",
    "numpy<2.0",
    "plyfile",
    "h5py",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src", "thirdparty"]

[tool.setuptools.package-data]
"brepnet.data.list" = ["*.txt"]
