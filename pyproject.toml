[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hola-brep"
version = "0.2.0"
description = "HoLa-BRep: Holistic Latent B-Rep Generation"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "torch>=2.4",
    "pytorch-lightning>=2.2",
    "hydra-core==1.3.2",
    "omegaconf>=2.3",
    "diffusers>=0.27",
    "transformers>=4.36",
    "einops>=0.7",
    "torch-scatter",
    "torch-sparse",
    "trimesh",
    "open3d>=0.18",
    "sentence-transformers>=2.2",
    "wandb",
    "tensorboard",
    "scipy",
    "numpy<2.0",
    "plyfile",
    "h5py",
    "tqdm",
    "rich>=13.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.preprocess" = ["splits/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["thirdparty", "src/eval/lfd/evaluation_scripts"]

[tool.ruff.lint]
# Real errors only: syntax, undefined names, invalid comparisons. Widen in its own PR.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Lazy compatibility exports resolved by __getattr__; revisit with the VAE restructure.
"src/models/blocks.py" = ["F822"]

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Package code does not import tools/ or tests/"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["tools", "tests"]

[[tool.importlinter.contracts]]
name = "src layers: entry points > eval/preference > postprocess > models > datasets > preprocess > common"
type = "layers"
layers = [
    "src.train | src.inference | src.evaluate",
    "src.eval : src.preference",
    "src.postprocess",
    "src.models",
    "src.datasets",
    "src.preprocess",
    "src.common",
]
# Known debt from the 2026-10-30 cleanup. Remove an entry when its import is fixed; never add one silently.
ignore_imports = [
    "src.postprocess.construct_brep -> src.eval.metrics.validity",
    "src.preprocess.extract_brep_from_step_half_structure -> src.postprocess.utils",
    "src.datasets.photo_preference -> src.preference.source",
    "src.datasets.preference -> src.models.diffusion.image_loading",
    "src.datasets.brep -> src.models.diffusion.image_loading",
]

[[tool.importlinter.contracts]]
name = "Training stack does not import dataset generation"
type = "forbidden"
source_modules = ["src.train", "src.inference", "src.evaluate", "src.eval", "src.preference", "src.postprocess", "src.datasets", "src.preprocess", "src.common"]
forbidden_modules = ["src.datagen"]

[[tool.importlinter.contracts]]
name = "Dataset generation does not import the training stack"
type = "forbidden"
source_modules = ["src.datagen"]
forbidden_modules = ["src.train", "src.inference", "src.evaluate", "src.eval", "src.preference", "src.postprocess", "src.datasets", "src.preprocess", "src.models"]
