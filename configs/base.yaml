dataset:
  data_root: ???
  train_list: null
  val_list: null
  test_list: null
  train_dataset: ???
  val_dataset: ???
  test_dataset: ???
  face_z_dir: null
  cond_root: null
  cached_condition: false
  condition: []
  is_aug: 0
  is_overfit: false
  overfit: false
  load_topology: false
  num_max_faces: 30
  pad_method: random
  num_points: 10000
  scale_factor: 1
  real_photo_ratio: 0.2
  augmentation:
    enabled: true
    random_rotate: true
    random_scale: true
    scale_range: [0.9, 1.1]

trainer:
  gpus: 1
  num_workers: 4
  batch_size: 32
  learning_rate: 1.0e-4
  max_epochs: 1000000
  max_steps: -1
  precision: bf16-mixed
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  vae_validation_inference: false
  gradient_clip_val: 1.0
  wandb:
    enabled: false
    project: hola-brep
    name: null
  resume_from: null
  init_from_checkpoint: null
  output_dir: ./outputs
  exp_name: default

eval:
  enabled: false
  output_dir: null
  num_samples: 100
  post_process: true

hydra:
  run:
    dir: ${trainer.output_dir}/${trainer.exp_name}
  job:
    chdir: false
