# Photo310k parameters -> true zero-gated AdaLN blocks; GT epsilon MSE only.
defaults:
  - trainer: default
  - _self_

model:
  name: AdaLNZeroPhotoDiffusion
  stage: diffusion
  legacy_checkpoint: null
  init_photo_checkpoint: null
  photo_global_step: 310000
  modulation_hidden_width: 256
  dino_repo: null
  legacy_source_cache: null
  checkpoint: null

condition: null

dataset:
  name: src.datasets.photo.PhotoGTOnlyDataset
  cache_root: ???
  validation_manifest: ???
  condition_data_root: ???
  train_dataset: ???
  val_dataset: ???
  epoch_scale_factor: 1

trainer:
  exp_name: diffusion_adaln_zero_photo
  devices: 7
  batch_size: 64
  learning_rate: 1.0e-5
  precision: 32-true
  max_steps: 10000000
  num_threads: 4
  num_workers: 2
  prefetch_factor: 4
  ddp_find_unused_parameters: false
  ddp_gradient_as_bucket_view: true
  sync_train_step_loss: false
  diffusion_validation_inference: false
  check_val_every_n_epoch: null
  val_check_interval: 1000
  checkpoint_every_n_train_steps: 5000
  checkpoint_step_keep_last: 3
  wandb:
    name: photo_gt_adaln_zero

eval:
  enabled: false
  output_dir: null

hydra:
  run:
    dir: ${brep_run_dir:${trainer.output_dir},${trainer.exp_name},${trainer.run_dir},${trainer.resume_from_checkpoint}}
  output_subdir: metadata/hydra
  job_logging:
    handlers:
      file:
        filename: ${brep_log_file:${hydra.runtime.output_dir}}
  job:
    chdir: false
