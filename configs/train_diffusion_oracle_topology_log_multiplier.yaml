defaults:
  - trainer: default
  - dataset: diffusion
  - model: diffusion
  - condition: single_img
  - _self_

trainer:
  batch_size: 64
  learning_rate: 1.0e-4
  devices: 8
  exp_name: outputs_oracle_topology_log_multiplier_real

dataset:
  name: Diffusion_dataset
  load_topology: true
  real_photo_ratio: 1.0
  validation_real_photo_ratio: 1.0
  is_aug: false
  is_overfit: false
  epoch_scale_factor: 200
  scale_factor: 200

model:
  padding:
    type: random
  topology_bias:
    enabled: true
    source: gt_adjacency
    target: self_attention
    mode: soft_bias
    timestep_weight: linear_high_noise
    parameterization: log_multiplier
    max_multiplier: 2.0

eval:
  enabled: false
  output_dir: null
  num_samples: 100
  post_process: true

hydra:
  run:
    dir: ${brep_run_dir:${trainer.output_dir},${trainer.exp_name},${trainer.run_dir},${trainer.resume_from_checkpoint}}
  output_subdir: metadata/hydra
  job_logging:
    handlers:
      file:
        filename: ${brep_log_file:${hydra.runtime.output_dir}}
  job:
    chdir: false
