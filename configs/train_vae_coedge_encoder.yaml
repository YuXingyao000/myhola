defaults:
  - train_vae_vertex_groups
  - _self_

# A/B use this entry, with enabled=false/source checkpoint for the control.
# Both start new Adam runs; candidate checkpoint is explicitly migrated.
trainer:
  exp_name: coedge_encoder/candidate
  devices: 3
  batch_size: 8
  accumulate_grad_batches: 4
  learning_rate: 2.0e-5
  max_steps: 10000
  max_time: null
  check_val_every_n_epoch: null
  val_check_interval: 2000
  checkpoint_every_n_train_steps: 1000
  checkpoint_step_keep_last: 1
  seed: 42
  wandb:
    name: vae-coedge-encoder-candidate

model:
  checkpoint: ${oc.env:IMG2BREP_COEDGE_CHECKPOINT}
  encoder_coedge:
    enabled: true
    hidden_dim: 128

dataset:
  coedge_topology_root: ${oc.env:IMG2BREP_COEDGE_ROOT}
