defaults:
  - trainer: default
  - dataset: vae
  - model: vae
  - condition: none

trainer:
  batch_size: 4
  learning_rate: 1.0e-4
  max_epochs: 1000000
  exp_name: train_vae

eval:
  enabled: false
  output_dir: null
  num_samples: 100
  post_process: true

hydra:
  run:
    dir: ${brep_run_dir:${trainer.output_dir},${trainer.exp_name},${trainer.run_dir},${trainer.resume_from_checkpoint}}
  output_subdir: metadata/hydra
  job_logging:
    handlers:
      file:
        filename: ${brep_log_file:${hydra.runtime.output_dir}}
  job:
    chdir: false
