defaults:
  - trainer: default
  - dataset: diffusion
  - model: diffusion
  - condition: single_img

trainer:
  batch_size: 64
  learning_rate: 1.0e-4
  devices: 8
  exp_name: learned_topology

dataset:
  name: Diffusion_dataset
  raw_data_root: /mnt/d/data/deepcad_v7
  cached_latent_root: /mnt/d/data/ae_cache/1119_deepcad_aug1_11k
  condition_data_root: /mnt/d/data/deepcad_v7_cond
  train_dataset: src/brepnet/data/list/deduplicated_deepcad_training_7_30.txt
  val_dataset: src/brepnet/data/list/deduplicated_deepcad_validation_7_30.txt
  test_dataset: src/brepnet/data/list/deduplicated_deepcad_testing_7_30.txt
  load_topology: false
  real_photo_ratio: 0.0
  epoch_scale_factor: 200

model:
  padding:
    type: random
  autoencoder:
    checkpoint: /mnt/d/data/ae_checkpoints/1119_deepcad_aug1_11k.ckpt
  topology_bias:
    enabled: true
    source: learned
    target: self_attention
    mode: soft_bias
    timestep_weight: linear_high_noise
    scale: 2.0
    predictor:
      checkpoint: experiments/2026-06-01/outputs_svr_single/best.pt
      max_faces: 30
      hidden_dim: 512
      face_dim: 128
      dino_model: facebook/dinov2-large
      freeze: true
      edge_threshold: 0.5

eval:
  enabled: false
  output_dir: null
  num_samples: 100
  post_process: true

hydra:
  run:
    dir: ${trainer.output_dir}/${trainer.exp_name}
  job:
    chdir: false
