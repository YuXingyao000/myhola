defaults:
  - trainer: default
  - dataset: diffusion
  - model: diffusion
  - condition: single_img

trainer:
  batch_size: 64
  learning_rate: 1.0e-4
  devices: 8
  exp_name: diffusion_baseline_real

dataset:
  name: Diffusion_dataset
  raw_data_root: /mnt/d/data/deepcad_v7
  cached_latent_root: /mnt/d/data/ae_cache/1119_deepcad_aug1_11k_24
  condition_data_root: /mnt/d/data/deepcad_v7_cond
  train_dataset: src/brepnet/data/list/deduplicated_deepcad_training_7_30.txt
  val_dataset: src/brepnet/data/list/deduplicated_deepcad_validation_7_30.txt
  test_dataset: src/brepnet/data/list/deduplicated_deepcad_testing_7_30.txt
  load_topology: false
  real_photo_ratio: 1.0
  validation_real_photo_ratio: 1.0
  is_aug: false
  is_overfit: false
  epoch_scale_factor: 200

model:
  autoencoder:
    checkpoint: /mnt/d/data/ae_checkpoints/1119_deepcad_aug1_11k.ckpt
  topology_bias:
    enabled: false
    scale: 2.0

eval:
  enabled: false
  output_dir: null
  num_samples: 100
  post_process: true

hydra:
  run:
    dir: ${trainer.output_dir}/${trainer.exp_name}
  job:
    chdir: false
