defaults:
  - train_vae_intersection_local
  - _self_

# Reproduce/resume the historical reduced-capacity local experiment.
# New experiments should use train_vae_intersection_local instead.
trainer:
  exp_name: intersection_local/frozen

model:
  intersection:
    block_type: cross_attention
    hidden_dim: 128
    num_heads: 4
    num_layers: 2
    ffn_dim: 256
    dropout: 0.0
    activation: gelu
