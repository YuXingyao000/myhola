devices: 1
accelerator: gpu
precision: bf16-mixed
num_workers: 4
# CPU threads per training process; null preserves the environment/Lightning default.
num_threads: null
prefetch_factor: 4
persistent_workers: true
ddp_find_unused_parameters: true
ddp_gradient_as_bucket_view: false
batch_size: 32
learning_rate: 1.0e-4
max_epochs: 1000000
max_steps: -1
# Optional Lightning training-time budget, DD:HH:MM:SS; null is unrestricted.
max_time: null
check_val_every_n_epoch: 1
num_sanity_val_steps: 2
vae_validation_inference: false
# Full diffusion sampling is optional and never runs during sanity validation.
diffusion_validation_inference: false
gradient_clip_val: 1.0
log_every_n_steps: 50
# False keeps global epoch loss and records only rank-0 local step diagnostics.
sync_train_step_loss: true
seed: 42
deterministic: false
cudnn_benchmark: true
checkpoint_enable_version_counter: true
limit_train_batches: 1.0
limit_val_batches: 1.0
limit_test_batches: 1.0
wandb:
  enabled: true
  project: hola-brep
  name: null
  offline: false
resume_from_checkpoint: null
init_from_checkpoint: null
evaluate: false
test_output_dir: null
output_dir: ./checkpoints
run_dir: null
exp_name: default
