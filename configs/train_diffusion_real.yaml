defaults:
  - trainer: default
  - dataset: diffusion
  - model: diffusion
  - condition: single_img

trainer:
  batch_size: 64
  learning_rate: 1.0e-4
  devices: 8
  exp_name: diffusion_real_photo

dataset:
  name: Diffusion_dataset
  real_photo_ratio: 1.0
  load_topology: false
  scale_factor: 200

eval:
  enabled: false
  output_dir: null
  num_samples: 100
  post_process: true

hydra:
  run:
    dir: ${brep_run_dir:${trainer.output_dir},${trainer.exp_name},${trainer.run_dir},${trainer.resume_from_checkpoint}}
  output_subdir: metadata/hydra
  job_logging:
    handlers:
      file:
        filename: ${brep_log_file:${hydra.runtime.output_dir}}
  job:
    chdir: false
